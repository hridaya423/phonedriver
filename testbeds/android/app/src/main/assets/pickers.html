<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Testbed pickers</title></head>
<body>
<label for="wd">Web date</label>
<input id="wd" type="date" value="2026-01-15" onchange="Testbed.log(JSON.stringify({ev:'picked',field:'web_date',value:this.value}))">
<br>
<label for="wt">Web time</label>
<input id="wt" type="time" value="09:05" onchange="Testbed.log(JSON.stringify({ev:'picked',field:'web_time',value:this.value}))">
</body>
</html>
