name: contacts-add
steps:
  - shell: "xcrun simctl terminate {udid} com.apple.MobileAddressBook || true"
  - launch: Contacts
  - expect: {absent: '"Zoe Phonedriver"'}
  - tap: Add
  - type: {text: Zoe, into: "First name"}
  - type: {text: Phonedriver, into: "Last name"}
  - tap: Done
  - expect: {element: {text: "Zoe Phonedriver"}}
  - tap: Edit
  - swipe: {direction: up}
  - swipe: {direction: up}
  - tap: {text: "Delete Contact", role: cell}
  - tap: {text: "Delete Contact", role: button}
  - expect: {absent: '"Zoe Phonedriver"'}
cleanup:
  - shell: "xcrun simctl terminate {udid} com.apple.MobileAddressBook || true"
