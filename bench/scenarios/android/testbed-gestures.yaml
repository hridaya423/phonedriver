name: testbed-gestures
device: android
steps:
  - shell: "am force-stop dev.phoneuse.testbed"
  - testbed: gestures
  - wait: "Gesture surface"
  - swipe: {direction: left}
  - expect: {log: {ev: touch, action: ACTION_DOWN}}
  - expect: {log: {ev: touch, action: ACTION_UP}}
  - tap: "Gesture surface"
  - expect: {log: {ev: touch, action: ACTION_UP}}
cleanup:
  - shell: "am force-stop dev.phoneuse.testbed"
