name: testbed-compose-item-300
device: android
steps:
  - shell: "am force-stop dev.phoneuse.testbed"
  - testbed: compose
  - wait: "Compose button"
  - shell: "logcat -c"
  - scroll: {direction: down, until: "Item 300"}
  - tap: "Item 300"
  - expect: {log: {ev: compose_item, n: 300}}
cleanup:
  - shell: "am force-stop dev.phoneuse.testbed"
