name: testbed-permission-dialog
device: android
steps:
  - shell: "pm clear dev.phonedriver.testbed"
  - testbed: dialogs
  - sleep_ms: 3000
  - tap: "Ask permission"
  - expect: {text: ["Allow", "ALLOW"]}
  - tap: ["Don’t allow", "DENY"]
  - expect: {absent: "access contacts"}
cleanup:
  - shell: "pm clear dev.phonedriver.testbed"
  - shell: "pm grant dev.phonedriver.testbed android.permission.POST_NOTIFICATIONS"
