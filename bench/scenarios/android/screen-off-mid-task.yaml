name: screen-off-mid-task
device: android
steps:
  - shell: "am force-stop dev.phonedriver.testbed"
  - testbed: taps
  - shell: "input keyevent KEYCODE_SLEEP"
  - sleep_ms: 1500
  - tap: "Dark theme"
  - expect: {log: {ev: toggle, on: true}}
cleanup:
  - shell: "input keyevent KEYCODE_WAKEUP"
  - shell: "wm dismiss-keyguard"
  - shell: "am force-stop dev.phonedriver.testbed"
