name: files-create-folder
steps:
  - shell: "rm -rf /sdcard/Download/phonedriver-m2"
  - shell: "pm clear com.google.android.documentsui"
  - shell: "pm clear com.android.documentsui"
  - launch: Files
  - wait: "More options"
  - tap: "More options"
  - tap: "New folder"
  - type: {text: "phonedriver-m2"}
  - tap: "OK"
  - expect: {text: "phonedriver-m2"}
  - expect: {shell: {cmd: "ls /sdcard/Download", contains: "phonedriver-m2"}}
cleanup:
  - shell: "rm -rf /sdcard/Download/phonedriver-m2"
  - shell: "pm clear com.google.android.documentsui"
  - shell: "pm clear com.android.documentsui"
