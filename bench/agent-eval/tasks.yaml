tasks:
  - name: dark-theme
    set: tuning
    prompt: "Turn on the dark theme on the phone."
    reset:
      - shell: "cmd uimode night no"
      - shell: "am force-stop com.android.settings"
      - press: home
    check:
      - expect: {shell: {cmd: "cmd uimode night", contains: "yes"}}
    cleanup:
      - shell: "cmd uimode night no"
      - shell: "am force-stop com.android.settings"

  - name: alarm-0730
    set: tuning
    prompt: "Set an alarm for 7:30 in the morning."
    reset:
      - shell: "pm clear com.google.android.deskclock"
      - press: home
    check:
      - expect: {shell: {cmd: "settings get system next_alarm_formatted", contains: "7:30 AM"}}
    cleanup:
      - shell: "pm clear com.google.android.deskclock"

  - name: testbed-web-form
    set: tuning
    prompt: "In the phonedriver testbed app, fill in the web form with the name Ada Lovelace, tick the agreement box and submit it."
    reset:
      - shell: "am force-stop dev.phonedriver.testbed"
      - testbed: taps
    check:
      - expect: {log: {ev: web, field: name, value: "Ada Lovelace"}}
      - expect: {log: {ev: web, field: agree, value: true}}
      - expect: {log: {ev: web, field: send}}
    cleanup:
      - shell: "am force-stop dev.phonedriver.testbed"

  - name: testbed-row-640
    set: tuning
    prompt: "In the phonedriver testbed app, find the list, scroll to the row called Row 640 and open it."
    reset:
      - shell: "am force-stop dev.phonedriver.testbed"
      - testbed: taps
    check:
      - expect: {log: {ev: row, n: 640}}
    cleanup:
      - shell: "am force-stop dev.phonedriver.testbed"

  - name: unicode-note
    set: tokens
    prompt: "In the phonedriver testbed app, open the Text tab and type `Zoë 你好 مرحبا 🙂` into the plain text field."
    reset:
      - shell: "am force-stop dev.phonedriver.testbed"
      - shell: "am start -n dev.phonedriver.testbed/.MainActivity --es tab text"
      - sleep_ms: 1500
      - clear_log
    check:
      - expect: {log: {ev: text, field: plain, value: "Zoë 你好 مرحبا 🙂"}}
    cleanup:
      - shell: "am force-stop dev.phonedriver.testbed"

  - name: alarm-gym
    set: tokens
    prompt: "In the Clock app, create an alarm for 7:30 AM labelled \"Gym\" that repeats on weekdays only."
    reset:
      - shell: "pm clear com.google.android.deskclock"
      - press: home
    check:
      - expect: {shell: {cmd: "su 0 sh -c 'sqlite3 /data/user_de/0/com.google.android.deskclock/databases/alarms.db \"select hour,minutes,label,daysofweek,enabled from alarm_templates\"'", contains: "7|30|Gym|31|1"}}
    cleanup:
      - shell: "pm clear com.google.android.deskclock"

  - name: wiki-birthdate
    set: tokens
    prompt: "In Chrome, open en.wikipedia.org, search for Grace Hopper and tell me her birth date. Answer with the date only, in the form Month D, YYYY."
    reset:
      - shell: "pm clear com.android.chrome"
      - press: home
    check:
      - expect: {answer: "December 9, 1906"}
    cleanup:
      - shell: "am force-stop com.android.chrome"
      - shell: "pm clear com.android.chrome"

  - name: notification-code
    set: tuning
    prompt: "The phonedriver testbed app has posted a notification that contains a verification code. Find the code and type it into the plain text field in the testbed app."
    reset:
      - shell: "am force-stop dev.phonedriver.testbed"
      - shell: "pm grant dev.phonedriver.testbed android.permission.POST_NOTIFICATIONS"
      - shell: "am start -n dev.phonedriver.testbed/.MainActivity --es tab text --es notify 'Your verification code is 482913'"
      - sleep_ms: 1500
      - shell: "cmd statusbar collapse"
      - clear_log
    check:
      - expect: {log: {ev: text, field: plain, value: "482913"}}
    cleanup:
      - shell: "cmd statusbar collapse"
      - shell: "cmd notification cancel dev.phonedriver.testbed 1"
      - shell: "am force-stop dev.phonedriver.testbed"

  - name: airplane-on-off
    set: heldout
    prompt: "Turn airplane mode on, then turn it off again."
    reset:
      - shell: "cmd connectivity airplane-mode disable"
      - shell: "logcat -G 16M"
      - shell: "logcat -c"
      - press: home
    check:
      - expect: {shell: {cmd: "logcat -d -s PhoneGlobals:I", contains: "isAirplaneNewlyOn=true"}}
      - expect: {shell: {cmd: "settings get global airplane_mode_on", contains: "0"}}
    cleanup:
      - shell: "cmd connectivity airplane-mode disable"
      - shell: "am force-stop com.android.settings"

  - name: files-new-folder
    set: heldout
    prompt: "Create a folder named \"phonedriver\" in the Files app."
    reset:
      - shell: "find /sdcard/ -maxdepth 4 -type d -name phonedriver -exec rm -rf {} +"
      - shell: "pm clear com.google.android.providers.media.module"
      - shell: "pm clear com.google.android.documentsui"
      - sleep_ms: 6000
      - press: home
    check:
      - expect: {shell: {cmd: "find /sdcard/ -maxdepth 4 -type d -name phonedriver", contains: "/phonedriver"}}
    cleanup:
      - shell: "find /sdcard/ -maxdepth 4 -type d -name phonedriver -exec rm -rf {} +"
      - shell: "pm clear com.google.android.providers.media.module"
      - shell: "pm clear com.google.android.documentsui"
      - sleep_ms: 6000

  - name: chrome-heading
    set: heldout
    prompt: "In Chrome, open example.com and tell me the heading of the page. Answer with the heading only."
    reset:
      - shell: "pm clear com.android.chrome"
      - press: home
    check:
      - expect: {answer: "Example Domain"}
      - expect: {text: "Example Domain"}
    cleanup:
      - shell: "am force-stop com.android.chrome"
      - shell: "pm clear com.android.chrome"

  - name: compose-third-switch
    set: heldout
    prompt: "In the phonedriver testbed app, open the Compose tab and turn on the third switch."
    reset:
      - shell: "am force-stop dev.phonedriver.testbed"
      - testbed: taps
    check:
      - expect: {log: {ev: compose_toggle, id: compose_switch_3, on: true}}
      - expect: {no_log: {ev: compose_toggle, id: compose_switch}}
      - expect: {no_log: {ev: compose_toggle, id: compose_switch_2}}
    cleanup:
      - shell: "am force-stop dev.phonedriver.testbed"

  - name: clock-timer-3min
    set: heldout
    prompt: "Set a 3-minute timer in the Clock app and start it."
    reset:
      - shell: "pm clear com.google.android.deskclock"
      - press: home
    check:
      - expect: {shell: {cmd: "dumpsys alarm | grep -A4 TIMER_EXPIRED | grep -o 'origWhen=+[0-9]*m'", contains: "origWhen=+2m"}}
    cleanup:
      - shell: "pm clear com.google.android.deskclock"

  - name: qa-signup
    set: jobs
    prompt: "Test the sign-up flow in the phonedriver testbed app (the Signup tab). Try it the way a careful tester would, including the mistakes real users make. Report every bug you find. For each bug give numbered steps to reproduce it, what you expected and what happened."
    reset:
      - script: "python3 jobs/jobs.py seed qa-signup"
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check qa-signup", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean qa-signup"

  - name: qa-shop
    set: jobs
    prompt: "Test the checkout in the phonedriver testbed app (the Shop tab): quantity, totals and the promo code SAVE10 (it should take 10% off). Placing the test order charges nothing and you may place it. Report every bug you find. For each bug give numbered steps to reproduce it, what you expected and what happened."
    reset:
      - script: "python3 jobs/jobs.py seed qa-shop"
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check qa-shop", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean qa-shop"

  - name: relay-code
    set: jobs
    prompt: "The phonedriver testbed app has a Relay tab that shows a locker pickup code. In the Contacts app, create a new contact named Locker 7 whose phone number is that pickup code. Use the phone's screens only: no shell, adb or logs."
    reset:
      - script: "python3 jobs/jobs.py seed relay-code"
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check relay-code", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean relay-code"

  - name: chrome-prefs
    set: jobs
    prompt: "In Chrome, set the default search engine to DuckDuckGo and turn on \"Always use secure connections\". Use Chrome's own settings. Skip sign-in and sync."
    reset:
      - script: "python3 jobs/jobs.py seed chrome-prefs"
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check chrome-prefs", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean chrome-prefs"

  - name: clock-settings
    set: jobs
    prompt: "In the Clock app, add world clocks for Tokyo and London. Then in the Clock settings set the snooze length to 15 minutes and Silence after to 5 minutes."
    reset:
      - script: "python3 jobs/jobs.py seed clock-settings"
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check clock-settings", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean clock-settings"

  - name: messages-pin-archive
    set: jobs
    prompt: "In Messages, pin the conversation with Bob Park and archive the conversation with Carol Diaz. Leave Alice Chen's conversation as it is."
    reset:
      - script: "python3 jobs/jobs.py seed messages-pin-archive"
      - sleep_ms: 4000
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check messages-pin-archive", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean messages-pin-archive"

  - name: photos-crop
    set: jobs
    prompt: "In Photos, open the picture jobs-harbor, crop it to a square and save it as a copy. Keep the original. Do not sign in or turn on backup."
    reset:
      - script: "python3 jobs/jobs.py seed photos-crop"
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check photos-crop", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean photos-crop"

  - name: wakelock-restrict
    set: jobs-mixed
    prompt: "This phone's battery is draining fast because an app keeps the CPU awake in the background. Find out which app holds the wakelock, then set that app's battery usage to Restricted in Settings. Do not restrict any other app."
    reset:
      - script: "python3 jobs/jobs.py seed wakelock-restrict"
      - sleep_ms: 2000
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check wakelock-restrict", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean wakelock-restrict"

  - name: log-code
    set: jobs-mixed
    prompt: "The phonedriver testbed app has written a locker pickup code to the device log. Find the code, then in the Contacts app create a contact named Locker 9 whose phone number is that code."
    reset:
      - script: "python3 jobs/jobs.py seed log-code"
      - press: home
    check:
      - expect: {script: "python3 jobs/jobs.py check log-code", timeout_ms: 1}
    cleanup:
      - script: "python3 jobs/jobs.py clean log-code"
