[package]
name = "phone-use-ios"
version.workspace = true
edition.workspace = true

[dependencies]
phone-use-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "macros", "time", "process", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints]
workspace = true
