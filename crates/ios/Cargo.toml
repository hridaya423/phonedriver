[package]
name = "phone-use-ios"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.22"
flate2 = "1.1.10"
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd", "pair", "core_device", "display_stream", "xctest", "tunnel_tcp_stack"] }
plist = "1.10.3"
phone-use-core = { version = "0.1.0", path = "../core" }
phone-use-video = { version = "0.1.0", path = "../video" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "macros", "time", "process", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints]
workspace = true
