[package]
name = "phone-use-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
bitflags = { version = "2.13.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
