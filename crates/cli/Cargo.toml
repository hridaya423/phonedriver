[package]
name = "phonedriver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[[bin]]
name = "phonedriver"
path = "src/main.rs"

[features]
default = ["android"]
android = ["dep:phonedriver-android"]

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
interprocess = { version = "2.4.7", features = ["tokio"] }
phonedriver-android = { version = "0.1.1", path = "../android", optional = true }
phonedriver-core = { version = "0.1.1", path = "../core" }
phonedriver-video = { version = "0.1.1", path = "../video" }
phonedriver-ios = { version = "0.1.1", path = "../ios" }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "elicitation"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "net", "process", "signal"] }
ulid = { version = "3.0.0", features = ["std"] }
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2.2.2"
phonedriver-android = { path = "../android" }
phonedriver-core = { path = "../core", features = ["testing"] }
phonedriver-ios = { path = "../ios", features = ["testing"] }
proptest = "1.12.0"
rmcp = { version = "3.9.0", features = ["client"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
