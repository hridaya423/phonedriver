[package]
name = "phone-use"
version.workspace = true
edition.workspace = true

[[bin]]
name = "phone-use"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
interprocess = { version = "2.4.7", features = ["tokio"] }
phone-use-android = { version = "0.1.0", path = "../android" }
phone-use-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "net", "process", "signal"] }
ulid = { version = "3.0.0", features = ["std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
phone-use-core = { path = "../core", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[lints]
workspace = true
