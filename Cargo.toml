[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.metadata.blaze]
version = "0.20261030.1"

[workspace.metadata.blaze.sandbox]
unsandboxed-build-scripts = ["phone-use-android"]
