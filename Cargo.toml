[workspace]
resolver = "3"
members = ["crates/*", "bench"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/hridaya423/phonedriver"
homepage = "https://phonedriver.dev"
description = "phonedriver is an open-source MCP server and CLI that lets AI agents like Claude Code see and control Android and iOS phones."

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.metadata.blaze]
version = "0.20261030.1"

[workspace.metadata.blaze.sandbox]
unsandboxed-build-scripts = ["phonedriver-android"]

[profile.dist]
inherits = "release"
lto = "thin"
