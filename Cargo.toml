[workspace]
resolver = "3"
members = ["crates/*", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/OWNER/phone-use"
homepage = "https://github.com/OWNER/phone-use"
description = "Lets AI agents see and operate Android and iOS devices."

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.metadata.blaze]
version = "0.20261030.1"

[workspace.metadata.blaze.sandbox]
unsandboxed-build-scripts = ["phone-use-android"]

[profile.dist]
inherits = "release"
lto = "thin"
