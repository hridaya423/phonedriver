- name: Fetch the Android agent jar
  uses: actions/download-artifact@v8
  with:
    name: agent-jar
    path: android-agent/build
- name: Use the Android agent jar
  shell: bash
  run: |
    set -euo pipefail
    echo "PHONEDRIVER_AGENT_JAR=$GITHUB_WORKSPACE/android-agent/build/phonedriver-agent.jar" >> "$GITHUB_ENV"
    sha256sum android-agent/build/phonedriver-agent.jar || shasum -a 256 android-agent/build/phonedriver-agent.jar
