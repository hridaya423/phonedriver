- name: Install JDK 17
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: "17"
- name: Install Android SDK build-tools 37.0.0 and platform android-37.0
  shell: bash
  run: |
    set -euo pipefail
    SDK="$RUNNER_TEMP/android-sdk"
    mkdir -p "$SDK/cmdline-tools"
    case "$RUNNER_OS" in
      Linux) os=linux ;;
      macOS) os=mac ;;
      Windows) os=win ;;
    esac
    curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-${os}-11076708_latest.zip"
    unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
    mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
    yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "build-tools;37.0.0" "platforms;android-37.0"
    echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
- name: Build the Android agent jar
  shell: bash
  run: |
    set -euo pipefail
    bash android-agent/build.sh
    echo "PHONEDRIVER_AGENT_JAR=$GITHUB_WORKSPACE/android-agent/build/phonedriver-agent.jar" >> "$GITHUB_ENV"
    sha256sum android-agent/build/phonedriver-agent.jar || shasum -a 256 android-agent/build/phonedriver-agent.jar
