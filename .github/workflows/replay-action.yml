name: replay action
on:
  push:
    branches: [main]
    paths: [action.yml, "action/**", .github/workflows/replay-action.yml, "testbeds/**", "crates/**", "android-agent/**", "ios-runner/**", Cargo.toml, Cargo.lock]
  pull_request:
    paths: [action.yml, "action/**", .github/workflows/replay-action.yml, "testbeds/**", "crates/**", "android-agent/**", "ios-runner/**", Cargo.toml, Cargo.lock]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Start an emulator while phonedriver builds
        env:
          API: "35"
        run: nohup bash action/emulator.sh start < /dev/null > "$RUNNER_TEMP/emulator-start.log" 2>&1 &
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('testbeds/android/**/*.gradle.kts', 'testbeds/android/gradle/**', 'testbeds/android/gradle.properties') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android-agent/build/phonedriver-agent.jar
          key: agent-jar-${{ runner.os }}-${{ hashFiles('android-agent/src/**', 'android-agent/aidl/**', 'android-agent/build.sh') }}
      - name: Build the Android agent
        run: "[ -f android-agent/build/phonedriver-agent.jar ] || bash android-agent/build.sh"
      - name: Build phonedriver
        run: PHONEDRIVER_AGENT_JAR="$GITHUB_WORKSPACE/android-agent/build/phonedriver-agent.jar" cargo build --locked -p phonedriver --config 'profile.dev.package."*".opt-level=3'
      - name: Build the Android testbed
        working-directory: testbeds/android
        run: ./gradlew --no-daemon -q assembleDebug
      - uses: ./
        with:
          binary: target/debug/phonedriver
          app: testbeds/android/app/build/outputs/apk/debug/app-debug.apk
          runs: testbeds/android/runs/*.steps
          record: true
          screens: testbeds/android/screens
          artifact: replay-android
      - name: A second replay compares each step's screen with the one the first kept
        uses: ./
        with:
          binary: target/debug/phonedriver
          runs: testbeds/android/runs/taps.steps
          screens: ${{ runner.temp }}/phonedriver-runs/screens
          artifact: replay-android-screens
      - name: A run that misses stops and fails the step
        id: missed
        continue-on-error: true
        uses: ./
        with:
          binary: target/debug/phonedriver
          runs: testbeds/android/runs/missing/*.steps
          artifact: replay-android-missed
      - name: The emulator's logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/emulator-start.log" "$RUNNER_TEMP/emulator.log" || true
      - name: Check that the missed run was reported
        env:
          FAILED: ${{ steps.missed.outputs.failed }}
          OUTCOME: ${{ steps.missed.outcome }}
        run: |
          echo "failed=$FAILED outcome=$OUTCOME"
          [ "$FAILED" = 1 ] && [ "$OUTCOME" = failure ]
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Name the runner image
        id: image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.phonedriver/runner/*/dd/Build/Products
          key: ios-runner-${{ steps.image.outputs.image }}-${{ hashFiles('ios-runner/**') }}
      - name: Boot a Simulator while phonedriver builds
        id: sim
        run: |
          cat > "$RUNNER_TEMP/boot.sh" <<'SH'
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))
            | reverse | map(.value[] | select(.name | startswith("iPhone"))) | .[0].udid')
          echo "$udid" > "$RUNNER_TEMP/udid.tmp"
          mv "$RUNNER_TEMP/udid.tmp" "$RUNNER_TEMP/udid"
          xcrun simctl bootstatus "$udid" -b
          SH
          nohup bash "$RUNNER_TEMP/boot.sh" < /dev/null > "$RUNNER_TEMP/boot.log" 2>&1 &
      - run: cargo build --locked -p phonedriver --config 'profile.dev.package."*".opt-level=3'
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 0
      - name: Wait for the Simulator to finish booting
        id: booted
        run: |
          for _ in $(seq 600); do
            [ -s "$RUNNER_TEMP/udid" ] && break
            sleep 0.5
          done
          if [ ! -s "$RUNNER_TEMP/udid" ]; then
            echo "::error::no iPhone Simulator was found to boot"
            cat "$RUNNER_TEMP/boot.log"
            exit 1
          fi
          udid=$(cat "$RUNNER_TEMP/udid")
          xcrun simctl bootstatus "$udid"
          cat "$RUNNER_TEMP/boot.log"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          platform: ios
          device: ${{ steps.booted.outputs.udid }}
          binary: target/debug/phonedriver
          runs: testbeds/ios/runs/*.steps
          artifact: replay-ios
      - name: The runner's log
        if: always()
        run: tail -n 60 ~/.phonedriver/runner/*.log
