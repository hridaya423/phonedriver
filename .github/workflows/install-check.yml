name: install-check
on: workflow_dispatch
jobs:
  npx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: The published package downloads and runs the released binary
        shell: bash
        run: |
          set -euo pipefail
          npx -y phonedriver --version | tee version.txt
          grep -qx "phonedriver 0.1.0" version.txt
          (echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"check","version":"0"}}}'; sleep 5) | npx -y phonedriver mcp > reply.txt
          head -c 200 reply.txt
          grep -q '"serverInfo":{"name":"phonedriver","version":"0.1.0"}' reply.txt
