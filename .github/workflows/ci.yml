name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - name: Build the Android agent jar
        shell: bash
        run: |
          bash android-agent/build.sh
          echo "PHONEDRIVER_AGENT_JAR=$GITHUB_WORKSPACE/android-agent/build/phonedriver-agent.jar" >> "$GITHUB_ENV"
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Lint without the Android feature
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -p phonedriver --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
      - run: node --test packaging/test/plugin.test.js
      - run: node --test packaging/npm/test/launcher.test.js
