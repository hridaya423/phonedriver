[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
hosting = "github"
installers = ["shell", "powershell", "homebrew"]
tap = "hridaya423/homebrew-tap"
publish-jobs = ["homebrew"]
install-path = "CARGO_HOME"
install-updater = false
include = ["NOTICE"]
unix-archive = ".tar.gz"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
github-build-setup = "../release-build-setup.yml"
